name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    # Pin the runner image: ubuntu-latest has moved to Ubuntu 26.04, which no
    # longer ships prebuilt Ruby 3.1 binaries (ruby/setup-ruby 404s on it).
    # 24.04 provides the whole 3.1–3.3 range this gem supports.
    runs-on: ubuntu-24.04
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.gemfile }}

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3"]
        gemfile:
          - gemfiles/rails-7.0.gemfile
          - gemfiles/rails-7.1.gemfile
          - gemfiles/rails-8.0.gemfile
          - gemfiles/rails-8.1.gemfile
        exclude:
          # Rails 8 requires Ruby >= 3.2.
          - ruby: "3.1"
            gemfile: gemfiles/rails-8.0.gemfile
          - ruby: "3.1"
            gemfile: gemfiles/rails-8.1.gemfile

    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      BUNDLE_WITHOUT: "yard guard benchmarks"

    steps:
      - name: Checkout (with Doorkeeper submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake
